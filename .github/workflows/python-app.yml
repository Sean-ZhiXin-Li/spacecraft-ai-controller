name: smoke-test

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository code
      - uses: actions/checkout@v4

      # Setup micromamba (lightweight conda) and create environment
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          # Use the current Linux CPU baseline environment.
          environment-file: conda_envs/spacecraft_linux.yml
          # Enable caching to speed up future runs
          cache-environment: true

      # Run smoke tests inside the activated conda environment
      - name: Run repository smoke tests
        shell: bash -l {0}   # Required to properly activate conda env
        run: |
          # Print Python version (debugging)
          python -V

          # Show which Python is being used (should be from conda env)
          which python

          # Current Linux smoke tests
          python -m pytest -q Tests/test_env_smoke.py Tests/test_quickrun_smoke.py

          # Historical lightweight controller import/action smoke test
          python -m scripts.test_all_controllers

          # CSV-only regression guard for protected phase results
          python scripts/check_phase_results.py
