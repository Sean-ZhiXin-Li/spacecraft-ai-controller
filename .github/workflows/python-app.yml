name: smoke-test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Checkout repository code
    - uses: actions/checkout@v4

    # Setup micromamba (lightweight conda) and create environment
    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@v1
      with:
        # Use the provided environment.yml to create the env
        environment-file: environment.yml

        # Enable caching to speed up future runs
        cache-environment: true

    # Run smoke test inside the activated conda environment
    - name: Run controller smoke test
      shell: bash -l {0}   # Required to properly activate conda env
      run: |
        # Print Python version (debugging)
        python -V

        # Show which Python is being used (should be from conda env)
        which python

        # Run controller test script
        python -m scripts.test_all_controllers
