name: spacecraft

channels:
  - conda-forge
  - defaults

dependencies:
  # Python version for CI compatibility
  - python=3.10

  # Core scientific computing libraries
  - "numpy<2"
  - pandas
  - matplotlib

  # Control and optimization libraries
  - casadi
  - osqp
  - do-mpc

  # Reinforcement learning environment
  - gymnasium

  # SPICE wrapper for orbital mechanics
  - spiceypy

  # pip packages
  - pip
  - pip:
      # CPU PyTorch for CI stability
      - torch==2.2.0
